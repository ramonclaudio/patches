name: Reconcile ledger

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# One reconcile at a time so a cron run and a manual dispatch don't race the same branch.
concurrency:
  group: reconcile-ledger
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun scripts/reconcile.ts --fix
        env:
          GH_TOKEN: ${{ github.token }}
      # Needs the repo's "Allow GitHub Actions to create and approve pull requests" setting (or a PAT/App token).
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          author: Ray <hello@ramonclaudio.com>
          committer: Ray <hello@ramonclaudio.com>
          add-paths: README.md
          branch: chore/reconcile-ledger
          title: "chore: reconcile patches ledger"
          commit-message: "chore: reconcile patches ledger"
          delete-branch: true
          body: |
            Automated reconcile of the README ledger against GitHub and npm.
            Merged PRs move to the Merged table, shipped fixes get their version.
            Review the diff and merge if it looks right.
