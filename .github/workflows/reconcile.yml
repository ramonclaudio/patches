name: Reconcile ledger

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# One reconcile at a time so a cron run and a manual dispatch don't race the same branch.
concurrency:
  group: reconcile-ledger
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to a commit SHA (the step below opens a PR with the repo token).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun scripts/reconcile.ts --fix
        env:
          GH_TOKEN: ${{ github.token }}
      # Needs repo setting: Actions > General > Workflow permissions > "Allow GitHub Actions to
      # create and approve pull requests". Or pass a PAT/App token via `token:`.
      - uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          add-paths: README.md
          branch: chore/reconcile-ledger
          title: "chore: reconcile patches ledger"
          commit-message: "chore: reconcile patches ledger"
          delete-branch: true
          body: |
            Automated reconcile of the README ledger against GitHub and npm.
            Merged PRs move to the Merged table, shipped fixes get their version.
            Review the diff and merge if it looks right.
